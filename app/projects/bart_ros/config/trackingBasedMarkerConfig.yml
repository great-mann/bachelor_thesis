%YAML:1.0


# Marker tracker settings
config: !!MarkerTrackerConfig
    debugging: 0
    debug_images: 0
    useMedianFlow: 0
    decayTime: 1000
    minContourLengthAllowed: 10.0
    roiScalePrior: 1.3
    roiScaleRefinement: 1.3
    minMarkerSizeInPixels: 8
    maxNumberOfMarkers: 50
    markerSizePixels: [100, 100]
    markerSize: [0.084, 0.084]
    dejitterEpsilon: 5
    dejitterDamping: 0.05
    markerBodies: !!MarkerBody
        -name: "calibration"
         isStatic: 0
         markers:
             - { id:202, size:0.08290, position:[0.0, 0.0, 0.02345], orientation:[0.0, 0.0, 0.0, 1.0] }
             - { id:100, size:0.08290, position:[0.0, 0.0, -0.02345], orientation:[0.0, 1.0, 0.0, 0.0] }
    cameras: 
        - name: "default"
          isStatic: 1
          calibrationUrl: "exampleCameraCalibration.xml"
              
              
