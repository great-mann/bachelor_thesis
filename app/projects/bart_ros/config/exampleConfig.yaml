%YAML:1.0


# Marker tracker settings
config: !!MarkerTrackerConfig
    debugging: 0
    debug_images: 0
    useMedianFlow: 0
    decayTime: 1000
    minContourLengthAllowed: 10.0
    roiScalePrior: 1.3
    roiScaleRefinement: 1.3
    minMarkerSizeInPixels: 8
    maxNumberOfMarkers: 50
    markerSizePixels: [100, 100]
    markerSize: [0.084, 0.084]
    dejitterEpsilon: 5
    dejitterDamping: 0.05
    markerBodies: !!MarkerBody
        - name: "cube"
          isStatic: 0
          markers:
              - { id:21,  size:0.05566, position:[0.0355, 0, 0],  orientation:[0.57735, -0.57735, 0.57735, 2.0944] }
              - { id:202, size:0.05566, position:[0, -0.0355, 0], orientation:[0, -0.707107, 0.707107, 3.14159] }
              - { id:683, size:0.05566, position:[-0.0355, 0, 0], orientation:[0.57735, 0.57735, -0.57735, 2.0944] }
              - { id:100,  size:0.05566, position:[0, 0.0355, 0], orientation:[1, 0, 0, 1.57] }
              - { id:302, size:0.05566, position:[0, 0, -0.0355], orientation:[-0.707107, 0.707107, 0, 3.14159] }
              - { id:485, size:0.05566, position:[0, 0, 0.0355],  orientation:[0, 0, 1, -1.57] }
    cameras: 
        - name: "default"
          isStatic: 1
          calibrationUrl: "exampleCameraCalibration.xml"
              
              
