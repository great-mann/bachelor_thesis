%YAML:1.0
config:
    debugging: 1
    debug_images: 0

    timeout: 10
    scales: 3
    downScaleFactor: 0.5
    decayTime: 5000
    undistortImage: 0
    useMedianFlow: 0

    minContourLengthAllowed: 10.0
    roiScalePrior: 1.3
    roiScaleRefinement: 1.3
    minMarkerSizeInPixels: 8
    maxNumberOfMarkers: 50
    maxThreads: 1
    throttle: 0

    markerSizePixels: [100, 100]
    markerSize: [0.045, 0.045]

    dejitterEpsilon: 5.0
    dejitterDamping: 0.5

    useOTSUThreshold: 0

    cameras:
        - name: "default"
          isStatic: 1
          calibrationUrl: "../example/data/yaml/fake_cam.xml"

    singleMarkers:
        - id: 21
          size: 0.045
          body: ""
          isStatic: 0

    markerBodies: []
